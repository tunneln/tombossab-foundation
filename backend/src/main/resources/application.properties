spring.application.name=tombossab-foundation
spring.threads.virtual.enabled=true

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mail.host=mail.privateemail.com
spring.mail.port=587
spring.mail.username=contact@tombossabfoundation.org
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Where engagement notifications (contact/volunteer/subscription) are delivered.
app.mail.to=contact@tombossabfoundation.org

app.cors.allowed-origins=https://tombossabfoundation.org,https://www.tombossabfoundation.org

# Per-IP token bucket applied to POST /api/** only.
app.ratelimit.capacity=5
app.ratelimit.refill-minutes=1

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Mail is best-effort (submissions persist regardless); don't let SMTP gate liveness.
management.health.mail.enabled=false
