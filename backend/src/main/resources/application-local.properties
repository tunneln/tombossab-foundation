# Local development against docker-compose.dev.yml (Postgres :5432, Mailpit :1025/:8025).
spring.datasource.url=jdbc:postgresql://localhost:5432/tombossa
spring.datasource.username=tombossa
spring.datasource.password=tombossa

spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

app.cors.allowed-origins=http://localhost:3000

app.ratelimit.capacity=100
