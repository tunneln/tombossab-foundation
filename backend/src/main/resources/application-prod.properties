# Production. All secrets come from the environment (deploy/.env on the box).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Behind Caddy: honor X-Forwarded-* so client IPs and scheme are correct.
server.forward-headers-strategy=native

# API docs are a development aid; don't publish them in production.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
