name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # No API env vars: the build must stay hermetic (fixture-rendered).
      - run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          # The browser list is in the key so adding a browser can't restore a stale cache.
          key: ${{ runner.os }}-playwright-chromium-webkit-${{ hashFiles('frontend/package-lock.json') }}
      # WebKit = Safari's engine: scripts/overflow.test.mjs checks phone layouts in it.
      - run: npx playwright install --with-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit != 'true'
      # On a cache hit the browser binaries are restored; still ensure the OS libs.
      - run: npx playwright install-deps chromium webkit
        if: steps.playwright-cache.outputs.cache-hit == 'true'
      - run: npm test

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # verify includes Testcontainers ITs; the runner provides Docker.
      - run: ./mvnw -B verify

  # The release tooling (docs/RELEASING.md): its scripts' tests, and the commit
  # message format, which the local hook enforces but can be skipped.
  release-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the release scripts
        run: .github/scripts/test-release-scripts.sh
      - name: Check commit messages
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: .github/scripts/check-commit-range.sh
