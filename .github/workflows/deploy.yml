name: Deploy backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "deploy/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

concurrency: deploy-backend

jobs:
  deploy:
    # Flip the repo variable DEPLOY_ENABLED to 'true' at cutover (runbook step).
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/tunneln/tombossab-backend:latest
            ghcr.io/tunneln/tombossab-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USER }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          script: |
            cd /opt/tombossab/deploy
            docker compose pull app
            docker compose up -d
            docker system prune -f

      - name: Revalidate frontend content
        # Best-effort: pages also carry a time-based revalidate as the net.
        run: |
          curl -fsS -X POST \
            -H "x-revalidate-secret: ${{ secrets.REVALIDATE_SECRET }}" \
            https://tombossabfoundation.org/api/revalidate \
            || echo "::warning::revalidate ping failed; hourly ISR will pick changes up"
