# Dependabot version updates: a weekly check for newer dependency versions,
# opened as pull requests against develop (Git Flow: develop, then main).
# Minor and patch bumps arrive together in one PR per ecosystem; each major
# bump gets its own PR, since majors can break things and need a real review.
#
# This file only schedules routine upgrade PRs. Security alerts are separate:
# they still appear as soon as an advisory is published.
#
# Not covered on purpose: the Docker images. They use floating tags
# (postgres:16-alpine, eclipse-temurin:21-jre-alpine), so Dependabot could only
# offer major jumps like Postgres 16 to 18, which need a planned data migration.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    # Wait until a release has been public for a week, so a compromised or
    # quickly withdrawn version is usually caught before it's proposed.
    # (Security updates are never delayed.)
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    # "deps:" marks a change to what ships; dev-only tools (Playwright) get "chore:".
    commit-message:
      prefix: deps
      prefix-development: chore

  - package-ecosystem: maven
    directory: /backend
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    cooldown:
      default-days: 7
    groups:
      maven-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: deps
      prefix-development: chore

  # The actions used by the CI and deploy workflows (checkout, setup-node, ...).
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/New_York
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
